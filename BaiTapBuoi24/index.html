<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body class="bg-slate-50 text-slate-800 font-sans">
        <header class="bg-white h-16 px-8 shadow-sm flex flex-row justify-between items-center gap-10  ">
        <div class="text-xl font-bold text-indigo-600"><i class="fa-solid fa-cart-shopping"></i> FakeStore</div>
        <div class="w-1/2">
            <input type="text" placeholder="Tìm kiếm sản phẩm" class="w-full border rounded-full px-4 py-2 bg-gray-50 outline-none">
        </div>
        <div class="relative cursor-pointer">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center" id="cart-badge">0</span>
        </div>
        </header>
        <main class="max-w-7xl mx-auto mt-8 px-4 flex flex-row justify-between gap-10">
        <aside class="w-1/4 bg-white rounded-xl p-6 shadow-sm border border-gray-100 ">
            <h2 class="font-semibold text-lg mb-4">Danh mục</h2>
            <ul id="category-list" class="space-y-3 text-gray-600">
                
                
            </ul>
        </aside>
        <section class="w-3/4">
            <div class="mb-6">
                <h1 class="text-2xl font-bold">Tất cả sản phẩm</h1>
                <p class="text-gray-500">Hiển thị 20 sản phẩm</p>
            </div>
            
            <!-- Grid chứa các Product Card sẽ nằm ở đây -->
            <div class=" rounded-xl p-6 shadow-sm border border-gray-100 min-h-[400px] grid grid-cols-3 gap-6" id="product-list">
                
            </div>
        </section>
        </main>
    <script src="./app.js"></script>
</body>
</html>
