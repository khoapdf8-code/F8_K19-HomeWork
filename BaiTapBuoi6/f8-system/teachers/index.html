<html lang="vi">
<head>

    <title>Teachers Page</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">

        .section{
            color: green;
        }
        .title{
            color: red;
        }

    </style>
</head>
<body>
    <h1>TEACHERS PAGE</h1>

  Phan tu nay co: tag(h2) + class(.title) + id(#special) + inline style
  Selector thang: inline vi co do uu tien cao nhat, sau do den id, class, tag
  Mau hien thi: color: blue (vi inline style win)
-->
    <h2 class="title" id="special" style="color: blue;">Danh sach giang vien</h2>
    <h3 class="section">Giang vien HTML</h3>
    <h3 class="section">Giang vien CSS</h3>
    <h3 class="section">Giang vien JavaScript</h3>
    <h3 class="section">Giang vien Python</h3>

</body>
