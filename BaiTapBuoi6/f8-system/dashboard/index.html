<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .title{
            color: red;
        }
        .highlight{
            color: green;
        }
    </style>
</head>
<body>
    <!--
  Phan tu nay co: tag(h1) + class(.title) + id(#special) + inline style
  Selector thang: inline vi co do uu tien cao nhat, sau do den id, class, tag
  Mau hien thi: color: blue (vi inline style win)
-->
    <h1 class="title" id="special" style="color: blue;">DASHBOARD</h1>
    <h2 class="section">Tong quan he thong</h2>
    <h3 class="title">Courses</h3>
    <div class="big">
    <p class="highlight">Danh sách các khóa học</p>
    <h3 class="title">Students</h3>
    <p class="highlight">Danh sách sinh viên</p>
    <h3 class="title">Teachers</h3>
    <p class="highlight">Danh sách giảng viên</p>
    <h3 class="title">Orders</h3>
    <p class="highlight">Danh sách đơn hàng</p>
    <h3 class="title">Reports</h3>
    </div>
</body>
</html>
