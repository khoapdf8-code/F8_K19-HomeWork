<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Page</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        
        .title {
            color: pink;
        }
    </style>
</head>
<body>
    <h1 style="color:yellow">ORDERS PAGE</h1>
    <!--
  Phan tu nay co: tag(h2) + class(.title) + id(#special) + inline style
  Selector thang: inline vi co do uu tien cao nhat, sau do den id, class, tag
  Mau hien thi: color: blue (vi inline style win)
-->
    <h2 class="title" id="special" style="color:blue">Danh sach don hang</h2>
    <p style="color: green">Don hang 001</p>
    <p style="color: green">Don hang 002</p>
    <p class="highlight">Don hang 003</p>
    <p class="highlight">Don hang 004</p>
    <!-- Quan sát: phần tử h2 có cả .title + #special + inline style — cái nào thắng? Inline style win -->

</body>
</html>
