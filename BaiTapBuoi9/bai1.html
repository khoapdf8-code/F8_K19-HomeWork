<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Các hình tạo bằng Border CSS</title>
    <style>
    
        .shape-1 {
            width: 80px;
            height: 80px;
            border-width: 2px;
            border-style: solid;
            border-color: #c0392b;
            margin: 20px;
        }

        
        .shape-2 {
            width: 140px;
            height: 70px;
            border-width: 2px;
            border-style: solid;
            border-color: #2980b9;
            margin: 20px;
        }

        
        .shape-3 {
            width: 0;
            height: 0;
            border-width: 0 40px 80px 40px;
            border-style: solid;
            border-color: transparent transparent #2ecc71 transparent;
            margin: 20px;
        }

        
        .shape-4 {
            width: 0;
            height: 0;
            border-width: 80px 40px 0 40px;
            border-style: solid;
            border-color: #f39c12 transparent transparent transparent;
            margin: 20px;
        }

        
        .shape-5 {
            width: 0;
            height: 0;
            border-width: 40px 80px 40px 0;
            border-style: solid;
            border-color: transparent #9b59b6 transparent transparent;
            margin: 20px;
        }

        
        .shape-6 {
            width: 0;
            height: 0;
            border-width: 40px 0 40px 80px;
            border-style: solid;
            border-color: transparent transparent transparent #e67e22;
            margin: 20px;
        }

        
        .shape-7 {
            width: 60px;
            height: 0;
            border-width: 0 20px 60px 20px;
            border-style: solid;
            border-color: transparent transparent #1abc9c transparent;
            margin: 20px;
        }

        
        .shape-8 {
            width: 0;
            height: 0;
            border-width: 0 70px 40px 70px;
            border-style: solid;
            border-color: transparent transparent #34495e transparent;
            margin: 20px;
        }

        
        .shape-9 {
            width: 0;
            height: 0;
            border-width: 0 20px 100px 20px;
            border-style: solid;
            border-color: transparent transparent #c0392b transparent;
            margin: 20px;
        }

        
        .shape-10 {
            width: 0;
            height: 0;
            border-width: 0 40px 60px 40px;
            border-style: solid;
            border-color: transparent transparent #d35400 transparent;
            margin: 20px;
        }

       
        .shape-11 {
            width: 0;
            height: 0;
            border-width: 30px 0 30px 50px;
            border-style: solid;
            border-color: transparent transparent transparent #45b39d;
            margin: 20px;
        }

        
        .shape-12 {
            width: 0;
            height: 0;
            border-width: 30px 50px 30px 0;
            border-style: solid;
            border-color: transparent #8e44ad transparent transparent;
            margin: 20px;
        }

        
        .shape-13 {
            width: 60px;
            height: 0;
            
            border-width: 25px 25px 25px 0;
            border-style: solid;
            border-color: #c0392b transparent #c0392b #c0392b; 
            margin: 20px;
        }

        
        .f8-container {
            margin: 40px 20px;
        }
        
        
        .letter-f, .letter-8 {
            display: inline-block;
        }

        .letter-8 {
            margin-left: 15px;
        }

       
        .f-top {
            width: 45px;
            height: 45px;
            border-width: 20px 0 0 20px;
            border-style: solid;
            border-color: #c0392b transparent transparent #c0392b;
        }
        
        .f-bottom {
            width: 30px;
            height: 55px;
            border-width: 20px 0 0 20px;
            border-style: solid;
            border-color: #c0392b transparent transparent #c0392b;
        }

        
        .eight-top {
            width: 30px;
            height: 35px;
            border-width: 20px 20px 10px 20px; 
            border-style: solid;
            border-color: #c0392b;
        }

        .eight-bottom {
            width: 30px;
            height: 45px;
            border-width: 10px 20px 20px 20px; 
            border-style: solid;
            border-color: #c0392b;
        }

    </style>
</head>
<body>
    <header>
        <h1>Các hình có thể tạo được với border</h1>
    </header>
    <div>1. Hình vuông</div>
    <div class="shape-1"></div>

    <div>2. Hình chữ nhật</div>
    <div class="shape-2"></div>

    <div>3. Tam giác lên</div>
    <div class="shape-3"></div>

    <div>4. Tam giác xuống</div>
    <div class="shape-4"></div>

    <div>5. Tam giác trái</div>
    <div class="shape-5"></div>

    <div>6. Tam giác phải</div>
    <div class="shape-6"></div>

    <div>7. Hình thang</div>
    <div class="shape-7"></div>

    <div>8. Tam giác rộng</div>
    <div class="shape-8"></div>

    <div>9. Tam giác nhọn</div>
    <div class="shape-9"></div>

    <div>10. Tam giác cân</div>
    <div class="shape-10"></div>

    <div>11. Mũi tên phải</div>
    <div class="shape-11"></div>

    <div>12. Mũi tên trái</div>
    <div class="shape-12"></div>

    <div>13. Ribbon/Lá cờ</div>
    <div class="shape-13"></div>

    <div>14. F8</div>
    <div class="f8-container">
        <div class="letter-f">
            <div class="f-top"></div>
            <div class="f-bottom"></div>
        </div>
        <div class="letter-8">
            <div class="eight-top"></div>
            <div class="eight-bottom"></div>
        </div>
    </div>

</body>
</html>
